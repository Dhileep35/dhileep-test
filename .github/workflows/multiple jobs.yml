name: Multiple Jobs Example

on:
  workflow_dispatch:
    
jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Print Message 1
        run: echo "Hello from Job 1"

  job2:
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Print Message 2
        run: echo "Hello from Job 2"
